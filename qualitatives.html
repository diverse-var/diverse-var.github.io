<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DiverseVAR qualitative image and video comparisons">
    <title>Qualitatives | DiverseVAR</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <header class="hero qualitative-hero">
        <div class="container hero-inner">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> DiverseVAR</a>
            <h1>Additional Qualitative</h1>
            <div class="links">
                <a href="#image-gallery" class="btn">
                    <span class="icon"><i class="fas fa-image"></i></span>
                    Images
                </a>
                <a href="#video-gallery" class="btn">
                    <span class="icon"><i class="fas fa-film"></i></span>
                    Videos
                </a>
                <a href="https://arxiv.org/abs/2511.21415" class="btn muted-link" target="_blank">
                    <span class="icon"><i class="fas fa-file-pdf"></i></span>
                    Paper
                </a>
            </div>
        </div>
    </header>

    <main>
        <section id="image-gallery">
            <div class="container">
                <div class="group-heading">
                    <span class="group-kicker">Text-to-image</span>
                    <h2>Images</h2>
                </div>

                <div class="model-switcher">
                    <input type="radio" name="image-model" id="image-model-infinity" checked>
                    <input type="radio" name="image-model" id="image-model-switti">
                    <span class="switcher-label">Base model</span>
                    <div class="model-switcher-tabs" role="tablist" aria-label="Base model">
                        <label for="image-model-infinity" role="tab">Infinity</label>
                        <label for="image-model-switti" role="tab">Switti</label>
                    </div>
                    <div id="image-model-panels" class="model-panels"></div>
                </div>
            </div>
        </section>

        <section id="video-gallery">
            <div class="container">
                <div class="group-heading">
                    <span class="group-kicker">Text-to-video</span>
                    <h2>Videos</h2>
                </div>

                <div class="model-switcher">
                    <span class="switcher-label">Base model</span>
                    <div class="model-switcher-tabs">
                        <span class="model-tab-static">InfinityStar</span>
                    </div>
                </div>

                <div id="video-list" class="video-grid"></div>
            </div>
        </section>
    </main>

    <script>
        const imageModels = [
            {
                id: "infinity",
                name: "Infinity",
                datasets: [
                    {
                        name: "MJHQ-30K",
                        path: "mjhq",
                        prompts: [
                            "a hamster dressed in CIA outfit",
                            "tiger cub playing with soccer ball",
                            "dinosaurs with sunglasses on partying, tshirt design, 80s style",
                            "a digital art piece in the style of two 1970s Disney artists, with charming animals in a vintage setting",
                            "a Velociraptor in Yellowstone National Park, exquisite detail, 85mm lens, sharp focus, diffuse backlighting"
                        ]
                    },
                    {
                        name: "MS-COCO",
                        path: "mscoco",
                        prompts: [
                            "a man with a skateboard is near so graffiti",
                            "A group of people walking around a lush green field.",
                            "A man that is standing next to train.",
                            "A man and a woman cutting a cake together.",
                            "A cat lays in the shade created by a pile of luggage."
                        ]
                    }
                ]
            },
            {
                id: "switti",
                name: "Switti",
                datasets: [
                    {
                        name: "MJHQ-30K",
                        path: "mjhq_switti",
                        prompts: [
                            "a hamster dressed in CIA outfit",
                            "tiger cub playing with soccer ball",
                            "dinosaurs with sunglasses on partying, tshirt design, 80s style",
                            "a digital art piece in the style of two 1970s Disney artists, with charming animals in a vintage setting",
                            "a Velociraptor in Yellowstone National Park, exquisite detail, 85mm lens, sharp focus, diffuse backlighting"
                        ]
                    },
                    {
                        name: "MS-COCO",
                        path: "mscoco_switti",
                        prompts: [
                            "a man with a skateboard is near so graffiti",
                            "A group of people walking around a lush green field.",
                            "A man that is standing next to train.",
                            "A man and a woman cutting a cake together.",
                            "A cat lays in the shade created by a pile of luggage."
                        ]
                    }
                ]
            }
        ];

        const stages = [
            { id: "base", label: "Base Model", added: false },
            { id: "condition", label: "Condition Annealing", added: true },
            { id: "scale", label: "Scale-Travel (Ours)", added: true }
        ];
        const plusMark = '<span class="stage-plus" aria-hidden="true">+</span>';
        const imageModelPanels = document.getElementById("image-model-panels");

        imageModels.forEach(model => {
            const panel = document.createElement("div");
            panel.className = `model-panel model-panel--${model.id}`;
            panel.setAttribute("role", "tabpanel");
            panel.setAttribute("aria-label", `${model.name} samples`);

            model.datasets.forEach(dataset => {
                const datasetCard = document.createElement("article");
                datasetCard.className = "dataset-card";
                const datasetHeader = document.createElement("header");
                datasetHeader.className = "dataset-card-header";
                datasetHeader.innerHTML = `<span class="dataset-eyebrow">${dataset.name}</span><h3>${model.name}</h3>`;
                datasetCard.appendChild(datasetHeader);

                const sampleStack = document.createElement("div");
                sampleStack.className = "sample-stack";
                dataset.prompts.forEach((prompt, promptIndex) => {
                    const sample = document.createElement("article");
                    sample.className = "sample-case";

                    const promptLine = document.createElement("p");
                    promptLine.className = "sample-prompt";
                    promptLine.textContent = prompt;
                    sample.appendChild(promptLine);

                    const resultGrid = document.createElement("div");
                    resultGrid.className = "result-grid";
                    stages.forEach(stage => {
                        const result = document.createElement("figure");
                        result.className = `result-panel result-panel--${stage.id}`;
                        result.innerHTML = `<figcaption>${stage.added ? plusMark : ""}${stage.label}</figcaption><div class="result-crop result-crop--${stage.id}"></div>`;
                        const image = document.createElement("img");
                        image.src = `assets/qualitatives/image/${dataset.path}/${promptIndex}.jpg`;
                        image.alt = `${model.name}, ${stage.label}, samples for: ${prompt}`;
                        image.loading = "lazy";
                        image.decoding = "async";
                        result.querySelector(".result-crop").appendChild(image);
                        resultGrid.appendChild(result);
                    });
                    sample.appendChild(resultGrid);
                    sampleStack.appendChild(sample);
                });
                datasetCard.appendChild(sampleStack);
                panel.appendChild(datasetCard);
            });
            imageModelPanels.appendChild(panel);
        });

        const videoCases = [
            {
                id: "00_teaser",
                prompt: "A flower changes from purple to orange.",
                files: {
                    base: ["A flower changes from purple to orange.-0.mp4", "A flower changes from purple to orange.-1.mp4", "A flower changes from purple to orange.-2.mp4"],
                    cads: ["A flower changes from purple to orange.-0.mp4", "A flower changes from purple to orange.-1.mp4", "A flower changes from purple to orange.-2.mp4"],
                    ours: ["A flower changes from purple to orange.-0.mp4", "A flower changes from purple to orange.-1.mp4", "A flower changes from purple to orange.-2.mp4"]
                }
            },
            {
                id: "01_fox",
                prompt: "A white fox stands on a mossy rock in a moonlit snowy forest.",
                files: {
                    base: ["00001_20.mp4", "00001_12.mp4", "00001_10.mp4"],
                    cads: ["00000_20.mp4", "00000_12.mp4", "00000_10.mp4"],
                    ours: ["00001_20.mp4", "00001_12.mp4", "00001_10.mp4"]
                }
            },
            {
                id: "02_moon",
                prompt: "A nighttime scene transitions from a warm, golden moon to a cool, silvery moon.",
                files: {
                    base: ["The moon changes from yellow to silver.-0.mp4", "The moon changes from yellow to silver.-1.mp4", "The moon changes from yellow to silver.-2.mp4"],
                    cads: ["The moon changes from yellow to silver.-0.mp4", "The moon changes from yellow to silver.-1.mp4", "The moon changes from yellow to silver.-2.mp4"],
                    ours: ["The moon changes from yellow to silver.-0.mp4", "The moon changes from yellow to silver.-1.mp4", "The moon changes from yellow to silver.-2.mp4"]
                }
            },
            {
                id: "03_beach",
                prompt: "Pixel art beach at sunset. Low-angle view. A striped beach ball rolls along the shore as waves loop in and out.",
                files: {
                    base: ["00000_80.mp4", "00000_42.mp4", "00000_27.mp4"],
                    cads: ["00000_80.mp4", "00000_42.mp4", "00000_27.mp4"],
                    ours: ["00004_80.mp4", "00004_42.mp4", "00004_27.mp4"]
                }
            },
            {
                id: "04_oasis",
                prompt: "Desert oasis at sunset. A camel stands and walks to the pond as the camera slowly dollies in.",
                files: {
                    base: ["00000_84.mp4", "00000_28.mp4", "00000_16.mp4"],
                    cads: ["00000_84.mp4", "00000_28.mp4", "00000_16.mp4"],
                    ours: ["00000_84.mp4", "00000_28.mp4", "00000_16.mp4"]
                }
            },
            {
                id: "05_cow",
                prompt: "Red barn at sunset. A cow suddenly sprints across the meadow, kicking up dirt.",
                files: {
                    base: ["00000_26.mp4", "00000_19.mp4", "00000_13.mp4"],
                    cads: ["00000_26.mp4", "00000_19.mp4", "00000_13.mp4"],
                    ours: ["00000_26.mp4", "00000_19.mp4", "00000_13.mp4"]
                }
            },
            {
                id: "06_stone",
                prompt: "Stonehenge at golden hour. Ravens burst into the sky as a robed figure watches.",
                files: {
                    base: ["00002_21.mp4", "00002_18.mp4", "00002_04.mp4"],
                    cads: ["00002_21.mp4", "00002_18.mp4", "00002_04.mp4"],
                    ours: ["00002_21.mp4", "00002_18.mp4", "00002_04.mp4"]
                }
            },
            {
                id: "07_beach2",
                prompt: "Pixel art style, a picturesque coastal beach during springtime, with pastel clouds, palm trees, sailboats in the distance, and a sunset of orange and pink.",
                files: {
                    base: ["00000_25.mp4", "00000_05.mp4", "00000_02.mp4"],
                    cads: ["00000_25.mp4", "00000_05.mp4", "00000_02.mp4"],
                    ours: ["00000_25.mp4", "00000_05.mp4", "00000_02.mp4"]
                }
            },
            {
                id: "08_space",
                prompt: "CG astronaut in space with a glowing green helmet does a fast 360 spin as the camera slowly orbits and zooms out.",
                files: {
                    base: ["00002_84.mp4", "00002_40.mp4", "00002_39.mp4"],
                    cads: ["00002_84.mp4", "00002_40.mp4", "00002_39.mp4"],
                    ours: ["00002_84.mp4", "00002_40.mp4", "00002_39.mp4"]
                }
            }
        ];

        const methodLabels = {
            base: "Base Model",
            cads: "Condition Annealing",
            ours: "Scale-Travel (Ours)"
        };
        const videoList = document.getElementById("video-list");

        videoCases.forEach((videoCase, caseIndex) => {
            const card = document.createElement("article");
            card.className = "video-case";

            const promptLine = document.createElement("p");
            promptLine.className = "sample-prompt";
            promptLine.textContent = videoCase.prompt;
            card.appendChild(promptLine);

            const matrix = document.createElement("div");
            matrix.className = "video-matrix";
            Object.entries(videoCase.files).forEach(([method, files]) => {
                const row = document.createElement("div");
                row.className = `video-method-row video-method-row--${method}`;
                row.innerHTML = `<div class="video-method-label">${method === "base" ? "" : plusMark}${methodLabels[method]}</div><div class="video-thumb-grid"></div>`;
                const thumbGrid = row.querySelector(".video-thumb-grid");
                files.forEach((file, sampleIndex) => {
                    const video = document.createElement("video");
                    video.controls = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;
                    video.preload = "metadata";
                    video.setAttribute("aria-label", `${methodLabels[method]}, sample ${sampleIndex + 1}: ${videoCase.prompt}`);
                    video.src = encodeURI(`assets/qualitatives/video/${videoCase.id}/${method}/videos/${file}`);
                    thumbGrid.appendChild(video);
                });
                matrix.appendChild(row);
            });
            card.appendChild(matrix);
            videoList.appendChild(card);
        });
    </script>
</body>

</html>
